# WR-1 PHYSICAL MODEL — shared by all six scenarios
#
# This file defines the lattice, channel construction, material compositions,
# fuel recipe and transport data choices. Operating conditions and optimization
# goals belong in study.toml. The two nuclear_data/*.json files pin source
# checksums; they are verification records, not routine case-editing inputs.
#
# Dimensions and temperatures carry units in their field names. Atom densities
# are atoms/(barn cm). Extra numerical precision preserves the original model.


# ---------------------------------------------------------------------------
# UNITS
# ---------------------------------------------------------------------------

[units]
length = "mm unless the field ends in _cm"
atom_density = "atoms/barn-cm"
temperature = "K"

# ---------------------------------------------------------------------------
# LATTICE — one row per physical channel site; q and r are hexagonal coordinates
# ---------------------------------------------------------------------------

[lattice]
convention = "incremental triangular-lattice ring spacing; effective ring scale=sum(increments)/ring"
# id is a stable identity; channel_type selects the construction below.
sites = [
    { id = "A6", q = -3, r = 4, channel_type = "passive" },
    { id = "A8", q = -2, r = 4, channel_type = "passive" },
    { id = "A10", q = -1, r = 4, channel_type = "passive" },
    { id = "B3", q = -4, r = 3, channel_type = "passive" },
    { id = "B5", q = -3, r = 3, channel_type = "fuel_large_calandria" },
    { id = "B7", q = -2, r = 3, channel_type = "fuel_standard" },
    { id = "B9", q = -1, r = 3, channel_type = "fuel_standard" },
    { id = "B11", q = 0, r = 3, channel_type = "fuel_large_calandria" },
    { id = "B13", q = 1, r = 3, channel_type = "passive" },
    { id = "C2", q = -4, r = 2, channel_type = "passive" },
    { id = "C4", q = -3, r = 2, channel_type = "fuel_standard" },
    { id = "C6", q = -2, r = 2, channel_type = "fuel_standard" },
    { id = "C8", q = -1, r = 2, channel_type = "fuel_standard" },
    { id = "C10", q = 0, r = 2, channel_type = "fuel_standard" },
    { id = "C12", q = 1, r = 2, channel_type = "fuel_standard" },
    { id = "C14", q = 2, r = 2, channel_type = "passive" },
    { id = "D1", q = -4, r = 1, channel_type = "passive" },
    { id = "D3", q = -3, r = 1, channel_type = "fuel_standard" },
    { id = "D5", q = -2, r = 1, channel_type = "fuel_standard" },
    { id = "D7", q = -1, r = 1, channel_type = "fuel_large_calandria" },
    { id = "D9", q = 0, r = 1, channel_type = "fuel_large_calandria" },
    { id = "D11", q = 1, r = 1, channel_type = "fuel_standard" },
    { id = "D13", q = 2, r = 1, channel_type = "fuel_standard" },
    { id = "D15", q = 3, r = 1, channel_type = "passive" },
    { id = "E2", q = -3, r = 0, channel_type = "fuel_large_calandria" },
    { id = "E4", q = -2, r = 0, channel_type = "fuel_standard" },
    { id = "E6", q = -1, r = 0, channel_type = "fuel_large_calandria" },
    { id = "E8", q = 0, r = 0, channel_type = "fuel_large_calandria" },
    { id = "E10", q = 1, r = 0, channel_type = "fuel_large_calandria" },
    { id = "E12", q = 2, r = 0, channel_type = "fuel_standard" },
    { id = "E14", q = 3, r = 0, channel_type = "fuel_large_calandria" },
    { id = "F1", q = -3, r = -1, channel_type = "passive" },
    { id = "F3", q = -2, r = -1, channel_type = "fuel_standard" },
    { id = "F5", q = -1, r = -1, channel_type = "fuel_standard" },
    { id = "F7", q = 0, r = -1, channel_type = "fuel_large_calandria" },
    { id = "F9", q = 1, r = -1, channel_type = "fuel_large_calandria" },
    { id = "F11", q = 2, r = -1, channel_type = "fuel_standard" },
    { id = "F13", q = 3, r = -1, channel_type = "fuel_standard" },
    { id = "F15", q = 4, r = -1, channel_type = "passive" },
