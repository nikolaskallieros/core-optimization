    { id = "G6", q = 0, r = -2, channel_type = "fuel_standard" },
    { id = "G8", q = 1, r = -2, channel_type = "fuel_standard" },
    { id = "G10", q = 2, r = -2, channel_type = "fuel_standard" },
    { id = "G12", q = 3, r = -2, channel_type = "fuel_standard" },
    { id = "G14", q = 4, r = -2, channel_type = "passive" },
    { id = "H3", q = -1, r = -3, channel_type = "passive" },
    { id = "H5", q = 0, r = -3, channel_type = "fuel_large_calandria" },
