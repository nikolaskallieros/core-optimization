# WR-1 STUDY — start here when changing a calculation
#
# 1. Shared geometry, operation and goals are under [defaults.cycle].
# 2. The six labeled scenario sections below contain only their differences.
# 3. Select a scenario with prepare_step_N.py or STEP in run_optimization.py.
#    Preparation writes the resolved input and OpenMC model under runs/.
#
# Numbers keep their original precision so the retained cases are reproducible.
# Arrays follow ring order 0, 1, 2, 3 unless a nearby comment says otherwise.
# A { "$ref" = "..." } value reuses the named setting after scenario overrides.
# Change the original value to update every dependent setting.

schema_version = 1

# ---------------------------------------------------------------------------
# Files loaded with this study
# ---------------------------------------------------------------------------

[data]
model = "model.toml"
neutron_sources = "nuclear_data/neutron_sources.json"
depletion_sources = "nuclear_data/depletion_sources.json"

# ---------------------------------------------------------------------------
# SHARED PHYSICS AND OPERATING CONDITIONS
# ---------------------------------------------------------------------------

[defaults.cycle]
# Number of fuel assemblies stacked in each channel.
axial_positions = 3
# Height of one assembly [mm]; active height = count × height.
assembly_height_mm = 990.0
# Center-to-flat distance of the outer moderator hexagon [cm].
apothem_cm = 140.05283525425475
symmetry_boundary_type = "periodic"
outer_radial_boundary = "vacuum"
axial_boundaries = ["vacuum", "vacuum"]
# Power in the modeled one-sixth core [W]; full-core power is 35 MW.
power_W = 5833333.333333333
# Number of irradiation/refuelling cycles carried through the calculation.
cycles = 3
# All cycles participate in derivatives of the discharge objective.
differentiated_cycles = [1, 2, 3]
# Evaluate the objective at the end of this cycle.
objective_cycle = 3
initial_inventory = "fresh"
# Depletion interval boundaries as fractions of one cycle.
step_fractions = [0.0, 0.0125, 0.125, 0.375, 0.6875, 1.0]
boron_control = false
# Initial B-10 concentration [mg per kg of unborated moderator].
initial_boron_mg_B10_per_kg = 0.0
physical_inventory_response = true
# Energy bins used to collapse continuous-energy depletion rates.
depletion_flux_groups = 256
# Passive outer-ring pitch [mm]; it is not an optimization variable.
fixed_outer_pitch_mm = [234.95]
scope = "Three-cycle WR-1 fuel residence with synchronized loading and fixed boron."

# ---------------------------------------------------------------------------
# Surrogate resolution — refining this changes runtime and spatial accuracy
# ---------------------------------------------------------------------------

[defaults.cycle.diffusion_mesh]
triangular_subdivisions = 16
axial_subdivisions_per_assembly = 2

# ---------------------------------------------------------------------------
# Fuel movement — one fresh assembly enters each channel at every cycle boundary
# ---------------------------------------------------------------------------

[defaults.cycle.refueling]
rings = [0, 1, 2, 3]
cycle_days_bounds = { "$ref" = "#/settings/optimization/bounds/cycle_days" }

# ---------------------------------------------------------------------------
# OpenMC histories — exploratory precision used for the retained calculations
# ---------------------------------------------------------------------------

[defaults.cycle.sampling]
# Neutron histories per batch.
particles = 1_000
batches = 160
# Source-convergence batches excluded from tally statistics.
inactive = 80
seed = 20_301
threads = 2

# ---------------------------------------------------------------------------
# Maximum allowed Monte Carlo statistical uncertainties
# ---------------------------------------------------------------------------

[defaults.cycle.sampling_checks]
maximum_keff_standard_error = 0.005
maximum_power_relative_se_rms = 0.035
maximum_power_relative_se = 0.07

# ---------------------------------------------------------------------------
# Starting-loading search limits
# ---------------------------------------------------------------------------

[defaults.cycle.initialization]
maximum_enrichment = 0.05
bol_target_keff = 1.02
maximum_attempts = 3

# ---------------------------------------------------------------------------
# Shared physics goals — scenario-specific objective weights appear below
# ---------------------------------------------------------------------------

[defaults.cycle.objective]
# Burnup normalization [MWd per tonne of initial heavy metal].
reference_discharge_burnup_MWd_tHM = 5000.0
# Minimum multiplication factor; acceptance and surrogate targets refer here.
minimum_keff = 1.002
# Scale for a subcriticality penalty; this is not a statistical uncertainty.
keff_deficit_scale = 0.002

# ---------------------------------------------------------------------------
# Record of the exploratory sampling allowance
# ---------------------------------------------------------------------------

[defaults.cycle.sampling_allowance]
individual_power_se_limit = { "$ref" = "#/settings/cycle/sampling_checks/maximum_power_relative_se" }
basis = "Exploratory sampling; the statistical checks do not establish model accuracy."

# ---------------------------------------------------------------------------
# ADVANCED: fitting the diffusion surrogate to OpenMC observations
# ---------------------------------------------------------------------------

[defaults.calibration]
layouts = ["ring_material_axial"]
pooled_iterations = 150
selected_layout = "ring_material_axial"
coupled_iterations = 0
coupled_max_evaluations = 4
log_factor_bound = 2.302585092994046
log_factor_regularization = 0.0001
inventory_floor_atoms_cm3 = 100000000000000.0
inventory_relative_scale = 0.05
reaction_relative_scale = 0.05
maximum_family_scaled_rms = 2.0
maximum_inventory_relative_rms = 0.05
maximum_stage_inventory_relative_rms = 0.08
allow_exploratory_fit = true
basis_selection_relative_loss_allowance = 0.05
selection_policy = "Shared ring/material/axial basis; retain field and trajectory residuals."
scope = """\
    Fit native fields and the connected depletion trajectory with one shared spatial correction vector."""

# ---------------------------------------------------------------------------
# ADVANCED: search settings shared by all scenarios
# ---------------------------------------------------------------------------

[defaults.optimization]
surrogate_keff_target = { "$ref" = "#/settings/cycle/objective/minimum_keff" }
surrogate_keff_penalty_scale = { "$ref" = "#/settings/cycle/objective/keff_deficit_scale" }
surrogate_burnup_penalty_scale_MWd_tHM = 100.0
# Number of standard errors subtracted before checking native criticality.
native_keff_standard_errors = 0.0
native_minimum_keff = { "$ref" = "#/settings/cycle/objective/minimum_keff" }
native_stall_batches = 2
surrogate_keff_policy = "anchor_corrected_soft"
surrogate_keff_error_scale_floor = 1e-12
surrogate_keff_soft_weight = 0.05
surrogate_keff_large_deficit_scale = 0.5
scope = { "$ref" = "#/settings/optimization/objective" }
native_acceptance = "Declared geometry, bounds, sampling, criticality and scenario-specific limits."

# ---------------------------------------------------------------------------
# Adam step sizes for each design parameter, in that parameter's units
# ---------------------------------------------------------------------------

[defaults.optimization.learning_rates]
pitch_mm = 2.0
element_radius_mm = 1.0
enrichment = 0.001

# ---------------------------------------------------------------------------
# Hard design bounds — every pair is [minimum, maximum]
# ---------------------------------------------------------------------------

[defaults.optimization.bounds]
pitch_mm = [150.0, 350.0]
element_radius_mm = [25.0, 60.0]
enrichment = [0.007, 0.05]
# Allowed common refuelling period [days]; shared with the cycle calculation.
cycle_days = [20.0, 400.0]

# ---------------------------------------------------------------------------
# Maximum local change before another native transport evaluation
# ---------------------------------------------------------------------------

[defaults.optimization.trust_half_width]
pitch_mm = 15.0
element_radius_mm = 5.0
enrichment = 0.006

# ---------------------------------------------------------------------------
# Trial-step acceptance and backtracking
# ---------------------------------------------------------------------------

[defaults.optimization.step_control]
method = "backtracking"
maximum_backtracks = 4
minimum_fraction = 0.01

# ---------------------------------------------------------------------------
# SCENARIO 1 — Discharge burnup with radial channel-power balance
# ---------------------------------------------------------------------------

[scenarios."1".cycle.design]
# Pitch increments from ring 0 to 1, 1 to 2, and 2 to 3 [mm].
pitch_mm = [234.95, 234.95, 234.95]
# Homogenized element radius [mm], by fuel ring 0–3.
element_radius_mm = [41.275, 41.275, 41.275, 41.275]
# U-235 mass fraction of uranium, by ring; 0.024 means 2.4%.
